generated: '2026-07-19'
method: searched
source: https://developers.fellow.ai/reference/
authentication:
  style: api-key
  header: X-API-KEY
  oauth_surface: MCP server only (see authentication/fellow-authentication.yml)
  ref: authentication/fellow-authentication.yml
pagination:
  style: cursor
  request_location: request body (`pagination` object) for POST list endpoints; query params (`page_size`, `cursor`) for webhook list
  params:
    cursor: string | null   # null/omitted for first page
    page_size: integer       # default 20, range 1-50
  response_fields:
    page_info:
      cursor: next-page cursor, or null at end of results
      page_size: echoed page size
    data: array of records
  docs: https://developers.fellow.ai/reference/pagination
idempotency:
  request_idempotency: false
  notes: >-
    Fellow does not document an idempotency-key header for write requests. On the
    webhook *delivery* side, each event carries a unique `svix-id` header that
    receivers should use to de-duplicate retried deliveries (idempotent consumption),
    but this is not a request-idempotency contract for the REST API.
versioning:
  scheme: uri-path
  current: v1
  base_path: /api/v1
  host_pattern: https://{subdomain}.fellow.app
  ref: lifecycle/fellow-lifecycle.yml
error_envelope:
  format: custom-json
  shape:
    message: human-readable error string
    errors: optional array of {location, message} for field-level validation errors
  content_type: application/json
  ref: errors/fellow-problem-types.yml
rate_limiting:
  signal: HTTP 429 with code `rate_limited`
  limits: 3 req/s and 10,000 req/day per API key
  ref: rate-limits/fellow-rate-limits.yml
webhooks:
  transport: HTTP POST (svix-backed)
  verification: challenge-response URL verification (`url_verification` type, echo `challenge`)
  signing: HMAC-SHA256 over `{svix-id}.{svix-timestamp}.{body}`, headers svix-id / svix-timestamp / svix-signature (v1,<b64>)
  replay_protection: reject timestamps older than 5 minutes
  ref: asyncapi/fellow-webhooks-asyncapi.yml
access_model: >-
  All requests are scoped to what the key/token owner can access in the Fellow UI.
  Privileged (super-admin) keys widen read scope to the whole workspace; writes stay
  owner-scoped.
