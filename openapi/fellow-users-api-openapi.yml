openapi: 3.2.0
info:
  title: Fellow Developer Users API
  version: 1.0.3
  description: Create custom integrations and workflows with Fellow's meeting data
servers:
- url: https://{subdomain}.fellow.app
  description: Fellow
  variables:
    subdomain:
      default: your-fellow-subdomain
      description: The subdomain for your Fellow workspace
tags:
- name: Users
  description: Retrieve information about the currently authenticated user and their workspace.
paths:
  /api/v1/me:
    get:
      operationId: apps_developer_api_api_get_authenticated_user
      summary: Get Authenticated User
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
      description: Get information about the authenticated user and their workspace.
      tags:
      - Users
      security:
      - DeveloperAPIKeyAuth: []
components:
  schemas:
    UserInfo:
      description: User information in API responses.
      properties:
        id:
          title: Id
          type: string
        email:
          title: Email
          type: string
        full_name:
          title: Full Name
          type: string
      required:
      - id
      - email
      - full_name
      title: UserInfo
      type: object
    WorkspaceInfo:
      description: Workspace information in API responses.
      properties:
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        subdomain:
          title: Subdomain
          type: string
      required:
      - id
      - name
      - subdomain
      title: WorkspaceInfo
      type: object
    AuthenticatedUserResponse:
      description: Response for the /me endpoint.
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
        workspace:
          $ref: '#/components/schemas/WorkspaceInfo'
      required:
      - user
      - workspace
      title: AuthenticatedUserResponse
      type: object
  securitySchemes:
    DeveloperAPIKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
