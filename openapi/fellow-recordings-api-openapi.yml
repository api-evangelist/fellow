        event_guid:
          title: Event Guid
          type:
          - string
          - 'null'
        note_id:
          title: Note Id
          type:
          - string
          - 'null'
        user_has_calendar_event:
          title: User Has Calendar Event
          type:
          - boolean
          - 'null'
        transcript:
          allOf:
          - $ref: '#/components/schemas/Transcript'
            nullable: true
        ai_notes:
          items:
            $ref: '#/components/schemas/Recap'
          title: Ai Notes
          type:
          - array
          - 'null'
        media_url:
          description: Pre-signed URL for the recording media file. Requires privileged API key.
          title: Media Url
          type:
          - string
          - 'null'
      title: Recording
      type: object
    RecordingResponse:
      description: Response containing a single recording.
      properties:
        recording:
          $ref: '#/components/schemas/Recording'
      required:
      - recording
      title: RecordingResponse
      type: object
    PaginatedResponse_RecordingUpload_:
      properties:
        page_info:
          $ref: '#/components/schemas/PageInfo'
        data:
          items:
            $ref: '#/components/schemas/RecordingUpload'
          title: Data
          type: array
      required:
      - page_info
      - data
      title: PaginatedResponse[RecordingUpload]
      type: object
    PaginatedRequestParams:
      description: Parameters sent in a request to paginate a queryset.
      properties:
        cursor:
          title: Cursor
          type:
          - string
          - 'null'
        page_size:
          default: 20
          exclusiveMinimum: 0
          maximum: 50
          minimum: 1
          title: Page Size
          type: integer
      title: PaginatedRequestParams
      type: object
    RecordingUploadSubmitResponse:
      description: Response for POST /recordings/upload — the 201 confirming a recording was queued for import.
      properties:
        recording_id:
          title: Recording Id
          type: string
      required:
      - recording_id
      title: RecordingUploadSubmitResponse
      type: object
    TranscriptSegment:
      properties:
        start:
          title: Start
          type: number
        end:
          title: End
          type: number
        speaker:
          title: Speaker
          type:
          - string
          - 'null'
        text:
          title: Text
          type: string
      required:
      - start
      - end
      - speaker
      - text
      title: TranscriptSegment
      type: object
    RecapTemplateSectionType:
      enum:
      - STANDARD
      - CUSTOM
      title: APIRecapTemplateSectionType
      type: string
    RecordingUploadsListResponse:
      description: Response containing a paginated list of API-uploaded recordings with import status.
      properties:
        uploads:
          $ref: '#/components/schemas/PaginatedResponse_RecordingUpload_'
      required:
      - uploads
      title: RecordingUploadsListResponse
      type: object
    RecapTopic:
      properties:
        title:
          title: Title
          type: string
        bullet_points:
          items:
            $ref: '#/components/schemas/RecapBulletPoint'
          title: Bullet Points
          type: array
      required:
