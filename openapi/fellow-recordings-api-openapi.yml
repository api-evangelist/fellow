      type: object
    RecordingUploadRequest:
      properties:
        url:
          format: uri
          minLength: 1
          title: Url
          type: string
        title:
          maxLength: 255
          title: Title
          type: string
        language_code:
          allOf:
          - $ref: '#/components/schemas/TranscriptionLanguage'
            nullable: true
        media_auth:
          discriminator:
            mapping:
              basic_auth: '#/components/schemas/BasicAuth'
              bearer_token: '#/components/schemas/BearerTokenAuth'
            propertyName: type
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/BearerTokenAuth'
          - $ref: '#/components/schemas/BasicAuth'
          title: Media Auth
        channel_id:
          title: Channel Id
          type:
          - string
          - 'null'
        event_guid:
          title: Event Guid
          type:
          - string
          - 'null'
      required:
      - url
      - title
      title: RecordingUploadRequest
      type: object
    RecordingFilters:
      properties:
        event_guid:
          title: Event Guid
          type:
          - string
          - 'null'
        created_at_start:
          title: Created At Start
          type:
          - string
          - 'null'
        created_at_end:
          title: Created At End
          type:
          - string
          - 'null'
        updated_at_start:
          title: Updated At Start
          type:
          - string
          - 'null'
        updated_at_end:
          title: Updated At End
          type:
          - string
          - 'null'
        channel_id:
          title: Channel Id
          type:
          - string
          - 'null'
        title:
          title: Title
          type:
          - string
          - 'null'
      title: RecordingFilters
      type: object
    Recap:
