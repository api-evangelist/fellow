openapi: 3.2.0
info:
  title: Fellow Developer Recordings API
  version: 1.0.3
  description: Create custom integrations and workflows with Fellow's meeting data
servers:
- url: https://{subdomain}.fellow.app
  description: Fellow
  variables:
    subdomain:
      default: your-fellow-subdomain
      description: The subdomain for your Fellow workspace
tags:
- name: Recordings
  description: Access and manage meeting recordings. Retrieve individual recordings, list recordings with filters and pagination, or delete recordings (privileged access required).
paths:
  /api/v1/recording/{recording_id}:
    get:
      operationId: apps_developer_api_api_get_recording_by_id
      summary: Retrieve Recording
      parameters:
      - in: path
        name: recording_id
        schema:
          title: Recording Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingResponse'
      description: Retrieve a recording by its ID.
      tags:
      - Recordings
      security:
      - DeveloperAPIKeyAuth: []
    delete:
      operationId: apps_developer_api_api_delete_recording
      summary: Delete Recording
      parameters:
      - in: path
        name: recording_id
        schema:
          title: Recording Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
      description: 'Delete a recording by its ID.


        **Super Admin Access Required**: This endpoint is restricted to API keys with privileged access.

        Only users with super admin privileges can delete recordings through the API.'
      tags:
      - Recordings
      security:
      - DeveloperAPIKeyAuth: []
  /api/v1/recordings:
    post:
      operationId: apps_developer_api_api_get_recordings
      summary: List Recordings
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingsListResponse'
      description: List recordings with optional filters and pagination.
      tags:
      - Recordings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRecordingsRequest'
        required: true
      security:
      - DeveloperAPIKeyAuth: []
  /api/v1/recordings/upload:
    post:
      operationId: apps_developer_api_api_upload_recording
      summary: Upload Recording
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadSubmitResponse'
      description: Upload a recording from a URL.
      tags:
      - Recordings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingUploadRequest'
        required: true
      security:
      - DeveloperAPIKeyAuth: []
  /api/v1/recordings/upload/list:
    post:
      operationId: apps_developer_api_api_list_uploads
      summary: List Uploads
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadsListResponse'
      description: List API-uploaded recordings with their import status, with optional filters and pagination.
      tags:
      - Recordings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUploadsRequest'
        required: true
      security:
      - DeveloperAPIKeyAuth: []
  /api/v1/recordings/upload/{recording_id}:
    get:
      operationId: apps_developer_api_api_get_upload_by_id
      summary: Retrieve Upload
      parameters:
      - in: path
        name: recording_id
        schema:
          title: Recording Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadResponse'
      description: Retrieve a single API-uploaded recording with its import status.
      tags:
      - Recordings
      security:
      - DeveloperAPIKeyAuth: []
components:
  schemas:
    RecapBulletPoint:
      properties:
        timestamp:
          title: Timestamp
          type: integer
        text:
          title: Text
          type: string
      required:
      - timestamp
      - text
      title: RecapBulletPoint
      type: object
    Status:
      enum:
      - FAILED
      - PENDING
      - SUCCESS
      title: Status
      type: string
    MessageResponse:
      description: Simple message response for operations like delete.
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: MessageResponse
      type: object
    RecordingsListResponse:
      description: Response containing a paginated list of recordings.
      properties:
        recordings:
          $ref: '#/components/schemas/PaginatedResponse_Recording_'
      required:
      - recordings
      title: RecordingsListResponse
      type: object
    BearerTokenAuth:
      properties:
        type:
          const: bearer_token
          default: bearer_token
          title: Type
          type: string
        token:
          minLength: 1
          title: Token
          type: string
      required:
      - token
      title: BearerTokenAuth
      type: object
    RecordingUpload:
      description: 'The upload_api response: a recording''s API-import identity and status, nothing else.


        Deliberately omits the full Recording payload (transcript, recaps, media URL, calendar

        metadata) — this surface only reports what an API-upload client needs to poll an import

        to completion. The recording''s id is exposed as `recording_id` to match the submit

        endpoint (POST /recordings/upload), which returns the same key.'
      properties:
        recording_id:
          title: Recording Id
          type: string
        title:
          title: Title
          type:
          - string
          - 'null'
        created_at:
          format: date-time
          title: Created At
          type:
          - string
          - 'null'
        updated_at:
          format: date-time
          title: Updated At
          type:
          - string
          - 'null'
        status:
          allOf:
          - $ref: '#/components/schemas/Status'
            nullable: true
        failure_reason:
          title: Failure Reason
          type:
          - string
          - 'null'
      title: RecordingUpload
      type: object
    RecordingUploadResponse:
      description: Response containing a single API-uploaded recording with its import status.
      properties:
        upload:
          $ref: '#/components/schemas/RecordingUpload'
      required:
      - upload
      title: RecordingUploadResponse
      type: object
    Transcript:
      properties:
        speech_segments:
          items:
            $ref: '#/components/schemas/TranscriptSegment'
          title: Speech Segments
          type: array
        language_code:
          title: Language Code
          type:
          - string
          - 'null'
      required:
      - speech_segments
      title: Transcript
      type: object
    PaginatedResponse_Recording_:
      properties:
        page_info:
          $ref: '#/components/schemas/PageInfo'
        data:
          items:
            $ref: '#/components/schemas/Recording'
          title: Data
          type: array
      required:
      - page_info
      - data
      title: PaginatedResponse[Recording]
      type: object
    BasicAuth:
      properties:
        type:
          const: basic_auth
          default: basic_auth
          title: Type
          type: string
        username:
          minLength: 1
          title: Username
          type: string
        password:
          title: Password
          type: string
      required:
      - username
      - password
      title: BasicAuth
      type: object
    GetRecordingsRequest:
      description: Request body for getting recordings with optional filters and pagination.
      properties:
        pagination:
          allOf:
          - $ref: '#/components/schemas/PaginatedRequestParams'
            nullable: true
        include:
          allOf:
          - $ref: '#/components/schemas/RecordingIncludableExpensiveField'
            nullable: true
        filters:
          allOf:
          - $ref: '#/components/schemas/RecordingFilters'
            nullable: true
        media_url:
          allOf:
          - $ref: '#/components/schemas/MediaUrlConfig'
            nullable: true
      title: GetRecordingsRequest
      type: object
    RecordingIncludableExpensiveField:
      properties:
        transcript:
          default: false
          title: Transcript
          type: boolean
        ai_notes:
          default: false
          title: Ai Notes
          type: boolean
      title: RecordingIncludableExpensiveField
      type: object
    RecapKeyMoment:
      properties:
        timestamp:
          title: Timestamp
          type: integer
        text:
          title: Text
          type: string
      required:
      - timestamp
      - text
      title: RecapKeyMoment
      type: object
    RecapActionItem:
      properties:
        timestamp:
          title: Timestamp
          type: integer
        text:
          title: Text
          type: string
        id:
          title: Id
          type:
          - string
          - 'null'
        assignees:
          items:
            $ref: '#/components/schemas/ActionItemAssignee'
          title: Assignees
          type: array
        completion_type:
          enum:
          - all
          - any
          title: Completion Type
          type:
          - string
          - 'null'
        due_date:
          title: Due Date
          type:
          - string
          - 'null'
        accepted:
          title: Accepted
          type: boolean
        status:
          $ref: '#/components/schemas/ActionItemStatus'
      required:
      - timestamp
      - text
      - assignees
      - completion_type
      - accepted
      - status
      title: RecapActionItem
      type: object
    ActionItemStatus:
      enum:
      - Done
      - Archived
      - Incomplete
      title: ActionItemStatus
      type: string
    RecapDecision:
      properties:
        timestamp:
          title: Timestamp
          type: integer
        text:
          title: Text
          type: string
      required:
      - timestamp
      - text
      title: RecapDecision
      type: object
    MediaUrlConfig:
      description: Configuration for media_url expiration.
      properties:
        expire_in:
          description: Optional expiration time in seconds (1h-24h). Defaults to 12h if not specified.
          maximum: 86400
          minimum: 3600
          title: Expire In
          type:
          - integer
          - 'null'
      title: MediaUrlConfig
      type: object
    GetUploadsRequest:
      description: Request body for listing API-uploaded recordings with optional filters and pagination.
      properties:
        pagination:
          allOf:
          - $ref: '#/components/schemas/PaginatedRequestParams'
            nullable: true
        filters:
          allOf:
          - $ref: '#/components/schemas/UploadFilters'
            nullable: true
      title: GetUploadsRequest
      type: object
    UploadFilters:
      properties:
        event_guid:
          title: Event Guid
          type:
          - string
          - 'null'
        created_at_start:
          title: Created At Start
          type:
          - string
          - 'null'
        created_at_end:
          title: Created At End
          type:
          - string
          - 'null'
        updated_at_start:
          title: Updated At Start
          type:
          - string
          - 'null'
        updated_at_end:
          title: Updated At End
          type:
          - string
          - 'null'
        channel_id:
          title: Channel Id
          type:
          - string
          - 'null'
        title:
          title: Title
          type:
          - string
          - 'null'
        status:
          title: Status
          type:
          - string
          - 'null'
      title: UploadFilters
      type: object
    Recording:
      properties:
        id:
          title: Id
          type: string
        title:
          title: Title
          type:
          - string
          - 'null'
        created_at:
          format: date-time
          title: Created At
          type:
          - string
          - 'null'
        updated_at:
          format: date-time
          title: Updated At
          type:
          - string
          - 'null'
        started_at:
          format: date-time
          title: Started At
          type: string
        ended_at:
          format: date-time
          title: Ended At
          type:
          - string
          - 'null'
        event_call_url:
          title: Event Call Url
          type:
          - string
