- name: Fellow Developer API
  description: >-
    REST API for accessing Fellow meeting data — recordings, transcripts, structured
    notes, and action items — plus recording uploads and webhook management. Uses
    X-API-KEY authentication, cursor-based pagination, and svix-signed webhooks for
    real-time events (ai_note.generated, ai_note.shared_to_channel,
    action_item.assigned, action_item.completed).
