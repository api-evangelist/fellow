aid: fellow
name: Fellow
description: >-
  Fellow is an AI meeting assistant and meeting-management platform that records,
  transcribes, and summarizes meetings, then captures structured notes, action items,
  and decisions across a team's calendar. Fellow's Developer API opens that meeting
  data through a REST interface: authenticated workspace users generate personal
  API keys and retrieve recordings, transcripts, notes, and action items, upload
  recordings, and manage webhook subscriptions for real-time events. Fellow also
  publishes a hosted, OAuth-secured Model Context Protocol (MCP) server so AI
  assistants like Claude and ChatGPT can query meeting context in natural language.
  Backed by Craft Ventures and Felicis. The API requires a paid workspace plan and
  is governed by workspace admins under Security settings, with a 90-day audit log,
  SOC 2 Type II, HIPAA BAA availability, and GDPR/CCPA support.
